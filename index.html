function cleanText(x){var d=document.createElement('div');d.innerHTML=x||'';return(d.textContent||'').replace(/\s+/g,' ').trim()}function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function countryImages(code,name){if(imageCache[code])return imageCache[code];imageCache[code]=(async function(){var display=imageAliases[code]||name,categoryName=categoryAliases[code]||display,cities=(COUNTRY_CITY_DATA[code]||[]).slice(0,3),travel=COUNTRY_TRAVEL_DATA[code]||{},feature=(travel.knownFor||'').split(/[,;]/)[0],searches=[display+' iconic natural landscape',display+' famous landscape travel',cities[0]?cities[0]+' skyline landmark':display+' capital city landmark',cities[1]?cities[1]+' landmark cityscape':display+' historic landmark',feature?display+' '+feature:display+' national park'],categories=['Landscapes of '+categoryName,'Natural attractions in '+categoryName,'Cityscapes in '+categoryName,'Cultural heritage monuments in '+categoryName,'Tourism in '+categoryName],chosen=[],seen={},reject=/flag|map|locator|coat of arms|emblem|seal|logo|icon|passport|visa|currency|stamp|banknote|coin|diagram|chart|poster|book|pdf|svg|route|road sign|military|weapon|police|soldier|aircraft|vehicle|embassy|consulate|conference|meeting|delegation|ceremony|award|team|portrait|selfie|souvenir/i;function collect(pages,limit){var added=0;for(var page of pages){var info=page.imageinfo&&page.imageinfo[0],meta=info&&info.extmetadata||{},title=(page.title||'').replace(/^File:/,'');if(!info||!info.thumburl||!/^image\/(jpeg|png|webp)$/i.test(info.mime||'')||reject.test(title)||seen[info.thumburl])continue;seen[info.thumburl]=1;chosen.push({url:info.thumburl,source:info.descriptionurl||info.url,alt:cleanText(meta.ImageDescription&&meta.ImageDescription.value)||display+' landscape or city scene',credit:cleanText(meta.Artist&&meta.Artist.value)||'Wikimedia Commons contributor',license:cleanText(meta.LicenseShortName&&meta.LicenseShortName.value)||'Wikimedia Commons'});added++;if(chosen.length===4)return true;if(added>=limit)return false}return false}for(var search of searches){try{if(collect(await commonsRequest('search',search),1))return chosen}catch(e){}}for(var category of categor function loadCountryThumbs(){var photos=document.querySelectorAll('.country-photo[data-code]'),load=function(img){countryImages(img.dataset.code,img.dataset.name).then(function(items){if(items[0]&&document.body.contains(img)){img.src=items[0].url;img.alt=items[0].alt;img.onload=function(){img.classList.add('loaded')}}})};if(!('IntersectionObserver'in window)){photos.forEach(load);return}var observer=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){observer.unobserve(e.target);load(e.target)}})},{rootMargin:'180px'});photos.forEach(function(img){observer.observe(img)})}

function count(s){return Object.values(statuses).filter(function(x){return x===s}).length}function dashboard(){reset.hidden=false;bar.style.width='100%';app.className='card dashboard';var visited=count('visited'),bucket=count('bucket'),pct=Math.round(visited/countries.length*100),options=countries.map(function(c){return '<option value="'+c.name+'"></option>'}).join('');app.innerHTML='<div class="hero-row"><div><div class="eyebrow">My travel bucket list</div><h1>Explore the world</h1><p style="margin:0">Save dream destinations and track every stamp along the way.</p></div><div class="progress-ring" style="--angle:'+pct*3.6+'deg"><div class="ring-copy">'+pct+'%<small>explored</small></div></div></div><section class="quick-start"><h2>Start with a country</h2><p>Choose any country, then select the states, provinces, or regions you want to visit.</p><div class="quick-row"><input class="search" id="quickCountry" list="countryOptions" placeholder="Type a country name…" onkeydown="if(event.key===\'Enter\')quickOpen()"><datalist id="countryOptions">'+options+'</datalist><button class="btn primary" onclick="quickOpen()">Open country →</button></div><div class="quick-error" id="quickError"></div></section><div class="stats"><div class="stat"><strong>'+countries.length+'</strong><span>Countries</span></div><div class="stat"><strong>'+bucket+'</strong><span>Bucket list</span></div><div class="stat"><strong>'+visited+'</strong><span>Visited</span></div></div><div class="tabs"><button class="tab '+(tab==='bucket'?'active':'')+'" onclick="setTab(\'bucket\')">⭐ My bucket list</button><button class="tab '+(tab==='all'?'active':'')+'" onclick="setTab(\'all\')">All countries</button><button class="tab '+(tab==='visited'?'active':'')+'" onclick="setTab(\'visited\')">✓ Visited</button></div><div class="tools"><input class="search" id="search" type="search" placeholder="Search countries…" oninput="query=this.value;list()"><select class="filter" onchange="continent=this.value;list()">'+['A function renderRegions(){var all=COUNTRY_SUBDIVISIONS[selected.code]||[selected.name],chosen=regions[selected.code]||[],q=regionQuery.toLowerCase(),grid=document.getElementById('regionGrid'),found=all.map(function(name,index){return{name:name,index:index}}).filter(function(x){return x.name.toLowerCase().includes(q)});document.getElementById('regionCount').textContent=chosen.length+' selected';grid.innerHTML=found.length?found.map(function(x){var active=chosen.includes(x.name);return '<button class="region-chip '+(active?'active':'')+'" aria-pressed="'+active+'" onclick="toggleRegion('+x.index+')">'+x.name+'</button>'}).join(''):'<div class="empty">No matching regions.</div>'}
function toggleRegion(index){var all=COUNTRY_SUBDIVISIONS[selected.code]||[selected.name],name=all[index],chosen=(regions[selected.code]||[]).slice(),at=chosen.indexOf(name),wasUnlisted=!statuses[selected.code];if(at>=0)chosen.splice(at,1);else chosen.push(name);if(chosen.length){regions[selected.code]=chosen;if(wasUnlisted)statuses[selected.code]='bucket'}else delete regions[selected.code];save();renderRegions();if(wasUnlisted){document.querySelectorAll('.status-button').forEach(function(b){b.classList.remove('active')});document.querySelector('.status-button').classList.add('active')}}
